name: neuralink
services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      MODEL_PATH: /app/models/neuralink.keras
      MODEL_METADATA_PATH: /app/models/metadata.json
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in deploy/.env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-12000000}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      UNCERTAINTY_THRESHOLD: ${UNCERTAINTY_THRESHOLD:-0.7}
      LOG_LEVEL: INFO
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "1"
    volumes:
      - ../backend/models:/app/models:ro
    expose:
      - "8000"
    # No host port mapping: only Caddy exposes the application.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3
    networks: [app]
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/.env}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in deploy/.env}
      MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-6MB}
      API_UPSTREAM: backend:8000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: [no-new-privileges:true]
    networks: [app]
networks:
  app:
volumes:
  caddy_data:
  caddy_config:
